<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>We eat yummy snacks :)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="machine">
  <header class="head">
    <h1 class="nameplate">Infinite Money Printing Appliance</h1>
    <img class="maker" src="logo-sharpsharp.png" alt="sharp sharp" width="1000" height="109">
  </header>

  <section class="window" id="slots" aria-label="Fächer"></section>

  <section class="panel">
    <div class="display" id="display" role="status" aria-live="polite">
      <p class="credit" id="credit">Guthaben 0,00 €</p>
      <p class="message" id="message">Verbindung zum Automaten wird aufgebaut</p>
    </div>

    <div class="coins" aria-label="Münzeinwurf">
      <button class="coin coin--50" type="button" data-coin="50">50 ct</button>
      <button class="coin coin--100" type="button" data-coin="100">1 €</button>
      <button class="coin coin--200" type="button" data-coin="200">2 €</button>
    </div>

    <button class="abort" type="button" id="cancel">Abbruch</button>
  </section>

  <section class="trays">
    <button class="tray tray--drinks" type="button" id="output-tray" aria-label="Ausgabefach leeren">
      <span class="tray-label">Ausgabefach</span>
      <span class="tray-content" id="output-tray-content"></span>
    </button>
    <button class="tray tray--coins" type="button" id="coin-return" aria-label="Münzrückgabe leeren">
      <span class="tray-label">Münzrückgabe</span>
      <span class="tray-content" id="coin-return-content"></span>
    </button>
  </section>
</main>
